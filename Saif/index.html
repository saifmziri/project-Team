<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3 Ways to Add CSS</title>

    <!-- 1. EXTERNAL CSS: Linked from a separate file (style.css) -->
    <link rel="stylesheet" href="style.css" />

    <!-- 2. INTERNAL CSS: Placed inside the <style> tag within the <head> -->
    <style>
      h2 {
        color: green;
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- EXTERNAL CSS Target -->
    <h1>This heading is styled using External CSS</h1>

    <!-- INTERNAL CSS Target -->
    <h2>This heading is styled using Internal CSS</h2>

    <!-- 3. INLINE CSS: Applied directly to the HTML element using the "style" attribute -->
    <p style="color: blue; font-size: 18px">
      This paragraph is styled using Inline CSS.
      
    </p>
    
<h3>My Favorite Subjects</h3>
<ol>
  <li>Programming</li>
  <li>Web Design</li>
  <li>Computer Graphics</li>
</ol>

  </body>
</html>
