<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3 Ways to Add CSS</title>

    <!-- 1. EXTERNAL CSS: Linked from a separate file (style.css) -->
    <link rel="stylesheet" href="style.css" />

    <!-- 2. INTERNAL CSS: Placed inside the <style> tag within the <head> -->
    <style>
      h2 {
        color: green;
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>My Site</h1>
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
      <main>
        <section>
          <h2>About Me</h2>
          <p>This is a <span class="highlight">modern</span> website layout.</p>

          <div class="cards">
            <div class="card">
              <span class="badge">New</span>
              <h3>Card 1</h3>
              <p>Web Design</p>
            </div>
            <div class="card">
              <h3>Card 2</h3>
              <p>Development</p>
            </div>
          </div>
                      <div class="card">
              <h3>Card 3</h3>
              <p>Backend Development</p>
            </div>
          </div>
        </section>

        <aside>
          <h3>Quick Facts</h3>
          <p>Duhok, Kurdistan</p>
        </aside>
      </main>

        <footer>
          <p>&copy; 2024 My Site. All rights reserved.</p>
        </footer>

        
  </body>
</html>
